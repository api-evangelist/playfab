openapi: 3.2.0
info:
  title: PlayFab Client Account API
  description: PlayFab is Microsoft Azure's backend-as-a-service for live games.
  version: 1.0.0
  contact:
    name: API Evangelist
    email: kin@apievangelist.com
  license:
    name: Proprietary
servers:
- url: https://{titleId}.playfabapi.com
  description: PlayFab title-scoped API server
  variables:
    titleId:
      default: titleId
      description: Unique PlayFab title identifier.
security:
- sessionTicket: []
tags:
- name: Account
  description: PlayFab account metadata.
paths:
  /Client/GetTitlePublicKey:
    post:
      tags:
      - Account
      summary: Returns the title's RSA public key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - TitleId
              - TitleSharedSecret
              properties:
                TitleId:
                  type: string
                TitleSharedSecret:
                  type: string
      responses:
        '200':
          description: Public key returned.
      operationId: postClientGetTitlePublicKey
      x-operation-id-source: derived
  /Client/GetPhotonAuthenticationToken:
    post:
      tags:
      - Account
      summary: Get a Photon custom authentication token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - PhotonApplicationId
              properties:
                PhotonApplicationId:
                  type: string
      responses:
        '200':
          description: Token returned.
      operationId: postClientGetPhotonAuthenticationToken
      x-operation-id-source: derived
  /Client/SetPlayerSecret:
    post:
      tags:
      - Account
      summary: Set the player's secret used to sign API requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                PlayerSecret:
                  type: string
                EncryptedRequest:
                  type: string
      responses:
        '200':
          description: Player secret stored.
      operationId: postClientSetPlayerSecret
      x-operation-id-source: derived
components:
  securitySchemes:
    sessionTicket:
      type: apiKey
      in: header
      name: X-Authorization
      description: 'Session ticket returned by a successful `LoginWith*` call. Required

        for all Client API operations other than login/registration.

        '
    entityToken:
      type: apiKey
      in: header
      name: X-EntityToken
      description: Entity token used for Entity-model API calls.
